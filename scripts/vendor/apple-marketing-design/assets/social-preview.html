<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Social Preview · 1280×640</title>
<!--
  裁切实测：GitHub 列表卡片按 3.03:1 显示（400×132），
  1280×640 按此比例裁切，可视区 y = 109 ~ 531，上下各裁 109px。
  因此内容全部收在 y 152 ~ 492 之间，任何位置都有 ≥40px 呼吸。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }

  body {
    font-family: "SF Pro Display", "SF Pro Text", -apple-system,
                 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #000000;
    color: #f5f5f7;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1280px; height: 640px;
    overflow: hidden;
  }

  /* 双色光晕：紫在右上、蓝在右下，同一色相家族，不引入第二种强调色 */
  .glow-a {
    position: absolute;
    left: 520px; top: -300px;
    width: 1060px; height: 1100px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(108,65,230,.30) 0%,
      rgba(108,65,230,.11) 38%,
      rgba(108,65,230,0) 72%);
    pointer-events: none;
  }

  /* 安全区：左右 88（6.9%），上下 152 —— 3:1 裁切后仍留 41px 呼吸 */
  .safe {
    position: absolute;
    left: 88px; top: 152px;
    width: 1104px; height: 340px;
    display: grid;
    grid-template-columns: 604px 1fr;
    gap: 16px;
  }

  /* ---------- 左：文字 ---------- */
  .left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 16px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: rgba(245,245,247,.38);
    margin-bottom: 16px;
  }

  h1 {
    font-size: 72px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.008em;
    margin-bottom: 20px;
  }
  h1 .en {
    display: block;
    letter-spacing: -0.042em;
  }
  h1 .zh {
    letter-spacing: -0.03em;
  }

  .sub {
    font-size: 17px;
    font-weight: 300;
    line-height: 1.6;
    color: rgba(245,245,247,.62);
    margin-bottom: 20px;
  }

  .cmd {
    display: inline-block;
    align-self: flex-start;
    font-family: "SF Mono", ui-monospace, Consolas, monospace;
    font-size: 13px;
    color: rgba(126,224,176,.9);
    background: rgba(66,162,136,.07);
    border: 1px solid rgba(66,162,136,.20);
    border-radius: 8px;
    padding: 8px 16px;
    margin-bottom: 8px;
  }

  .url {
    font-size: 12px;
    color: rgba(245,245,247,.30);
  }

  /* ---------- 右：白卡 ---------- */
  .art {
    border-radius: 60px;          /* 短边 340 × 18% ≈ 61 */
    background: #f5f5f7;
    padding: 44px;
    box-shadow: 0 40px 110px rgba(108,65,230,.34), 0 0 0 1px rgba(255,255,255,.06);
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  .art-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: #6c6b6f;
  }

  .art-title {
    font-size: 62px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.035em;
    color: #1d1d1f;
    align-self: center;
  }

  /* 半边上色：只染前半句，用规范色板内的紫→蓝渐变 */
  .art-title .grad {
    background: linear-gradient(96deg, #6c41e6 0%, #0031ea 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .art-note {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    color: #6c6b6f;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow-a"></div>
  <div class="safe">

    <div class="left">
      <div class="eyebrow">AGENT SKILL</div>
      <h1><span class="en">Apple</span><span class="zh">设计语言</span></h1>
      <p class="sub">版式、字体、色彩、文案，<br>一套可以照着做的规范。</p>
      <div class="cmd">./install/install.sh --target claude</div>
      <div class="url">github.com/MokoKing666/apple-marketing-design</div>
    </div>

    <div class="art">
      <div class="art-kicker">色板 · 9 中性色 / 5 强调色</div>
      <div class="art-title"><span class="grad">不止</span>黑白。</div>
      <div class="art-note">四种底色，色彩只占版面的 5%。</div>
    </div>

  </div>
</div>
</body>
</html>
